name: Terraform Plan (manual, opt-in)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan; requires its protected plan environment
        type: choice
        required: true
        options: [dev, staging, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    # Only reviewed default-branch code can reach this sample's credentialed job.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_AWS_PLAN == 'true'
    uses: ./.github/workflows/terraform-check.yml

  plan:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: plan-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Terraform version
        id: versions
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false
      - name: Install checksum-verified OPA
        run: bash scripts/install-opa-ci.sh
      - name: Materialize protected environment configuration
        env:
          TFVARS_HCL: ${{ secrets.TFVARS_HCL }}
          BACKEND_HCL: ${{ secrets.BACKEND_HCL }}
          PLAN_ROLE: ${{ vars.AWS_PLAN_ROLE_ARN }}
          PLAN_REGION: ${{ vars.AWS_REGION }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for key in ('TFVARS_HCL', 'BACKEND_HCL', 'PLAN_ROLE', 'PLAN_REGION'):
              if not os.environ.get(key):
                  raise SystemExit(f'Missing protected environment setting: {key}')
          os.umask(0o077)
          target = Path('.harness/runtime').resolve()
          target.mkdir(parents=True, exist_ok=True)
          (target/'terraform.tfvars').write_text(os.environ['TFVARS_HCL'])
          (target/'backend.s3.hcl').write_text(os.environ['BACKEND_HCL'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VAR_FILE={target}/terraform.tfvars\nBACKEND_CONFIG={target}/backend.s3.hcl\n')
          PY
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
          role-session-name: harness-plan-${{ github.run_id }}
          unset-current-credentials: true
      - name: Saved plan, risk review and policy gate
        run: make plan
      # No apply, raw plan artifact upload, or automatic PR comment.
